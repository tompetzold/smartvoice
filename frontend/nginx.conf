server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The nginx image used here does not map .mjs reliably.
    # PDF.js ships its worker as an ES module (.mjs), and Chrome
    # refuses to execute it when it is served as application/octet-stream.
    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
