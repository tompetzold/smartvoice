services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartvoice-backend
    environment:
      SMARTVOICE_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    ports:
      - "8001:8001"
    volumes:
      - smartvoice_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/voices', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smartvoice-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  smartvoice_data:
    name: smartvoice_data
